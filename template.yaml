AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Serverless Help Desk - first vertical slice

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    Architectures:
      - x86_64

  Api:
    Cors:
      AllowMethods: "'GET,POST,PATCH,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'http://localhost:5500'"

Resources:
  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH
  NotificationTopic:
    Type: AWS::SNS::Topic
  CreateTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: create_ticket.app.lambda_handler
      Environment:
        Variables:
          TICKETS_TABLE_NAME: !Ref TicketsTable
          NOTIFICATION_TOPIC_ARN: !Ref NotificationTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref NotificationTopic
      Events:
        CreateTicketApi:
          Type: Api
          Properties:
            Path: /tickets
            Method: post
  
  ListTicketsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: list_tickets.app.lambda_handler
      Environment:
        Variables:
          TICKETS_TABLE_NAME: !Ref TicketsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TicketsTable
      Events:
        ListTicketsApi:
          Type: Api
          Properties:
            Path: /tickets
            Method: get
  GetTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: get_ticket.app.lambda_handler
      Environment:
        Variables:
          TICKETS_TABLE_NAME: !Ref TicketsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TicketsTable
      Events:
        GetTicketApi:
          Type: Api
          Properties:
            Path: /tickets/{ticketId}
            Method: get
  UpdateTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: update_ticket.app.lambda_handler
      Environment:
        Variables:
          TICKETS_TABLE_NAME: !Ref TicketsTable
          NOTIFICATION_TOPIC_ARN: !Ref NotificationTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref NotificationTopic    
      Events:
        UpdateTicketApi:
          Type: Api
          Properties:
            Path: /tickets/{ticketId}
            Method: patch
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: notification.app.lambda_handler
      Environment:
        Variables:
          SENDER_EMAIL: richardmorales_24@hotmail.com
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
      Events:
        NotificationEvent:
          Type: SNS
          Properties:
            Topic: !Ref NotificationTopic
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: serverless-help-desk-admins

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: serverless-help-desk-admin-client
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
Outputs:
  ApiUrl:
    Description: API endpoint for creating tickets
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/tickets"

  TicketsTableName:
    Description: DynamoDB tickets table
    Value: !Ref TicketsTable

  AdminUserPoolId:
    Description: Cognito User Pool ID for help desk administrators
    Value: !Ref AdminUserPool

  AdminUserPoolClientId:
    Description: Cognito App Client ID for help desk administrators
    Value: !Ref AdminUserPoolClient