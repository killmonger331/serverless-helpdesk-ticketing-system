<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Ticket Status</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <header class="site-header">
    <div class="brand">
      <img
        src="./images/logo.svg"
        alt="Organization Logo"
        class="organization-logo"
      >

      <div>
        <p class="organization-name">Rich's Help Desk</p>
        <p class="organization-subtitle">I fix computers ;)</p>
      </div>
    </div>
  </header>

  <main class="page-container">
    <section class="ticket-card">

      <div class="card-heading">
        <p class="eyebrow">Ticket Lookup</p>

        <h1>Check Ticket Status</h1>

        <p class="intro-text">
          Enter your ticket number and the email address used when
          submitting the ticket.
        </p>
      </div>

      <form id="ticketLookupForm">

        <div class="form-group">
          <label for="ticketId">Ticket Number</label>

          <input
            type="text"
            id="ticketId"
            name="ticketId"
            placeholder="TKT-12345678"
            required
          >
        </div>

        <div class="form-group">
          <label for="requesterEmail">Email Address</label>

          <input
            type="email"
            id="requesterEmail"
            name="requesterEmail"
            placeholder="you@example.com"
            required
          >
        </div>

        <button type="submit" class="submit-button">
          Check Status
        </button>

      </form>

      <p id="lookupMessage" class="lookup-message" hidden></p>

      <section id="ticketResult" class="ticket-result-card" hidden>
        <div class="ticket-result-header">
          <div>
            <p class="eyebrow">Current Ticket</p>
            <h2 id="resultTitle"></h2>
          </div>

          <span id="resultStatus" class="status-badge"></span>
        </div>

        <div class="ticket-detail-grid">

          <div class="ticket-detail-item">
            <span class="detail-label">Ticket Number</span>
            <span id="resultTicketId" class="detail-value"></span>
          </div>

          <div class="ticket-detail-item">
            <span class="detail-label">Priority</span>
            <span id="resultPriority" class="detail-value"></span>
          </div>

          <div class="ticket-detail-item">
            <span class="detail-label">Created</span>
            <span id="resultCreated" class="detail-value"></span>
          </div>

          <div class="ticket-detail-item">
            <span class="detail-label">Last Updated</span>
            <span id="resultUpdated" class="detail-value"></span>
          </div>

        </div>
      </section>

      <p class="ticket-status-link">
        Need to submit a new request?
        <a href="./index.html">Create a ticket</a>
      </p>

    </section>
  </main>

  <script type="module" src="./js/ticket-status.js"></script>
</body>
</html>
