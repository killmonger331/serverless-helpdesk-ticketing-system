<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administrator Login</title>

  <link
    rel="stylesheet"
    href="./css/styles.css"
  >
</head>

<body>
  <main class="page-container">
    <section class="ticket-card">
      <div class="card-heading">
        <p class="eyebrow">
          Operations Console
        </p>

        <h1>Administrator Login</h1>

        <p class="intro-text">
          Sign in to access the help desk administration console.
        </p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          id="login-button"
          type="submit"
          class="submit-button"
        >
          Sign in
        </button>

        <div class="message-container">
          <p
            id="login-message"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </form>
    </section>
  </main>

  <script
    type="module"
    src="./js/auth.js"
  ></script>
</body>
</html>
